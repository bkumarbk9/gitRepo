# Tests the Cloud Spreadsheet, then builds its container image with the .NET SDK (no Docker)
# and pushes it to GitHub Container Registry (ghcr.io).
#
# Image: ghcr.io/<owner>/cloudspreadsheet, tagged sha-<short commit> and latest.
# Only the newest VERSIONS_TO_KEEP versions are kept; older ones are deleted after each push.
# No secrets needed: it signs in to ghcr.io with the workflow's built-in GITHUB_TOKEN.
name: Build Cloud Spreadsheet image

on:
  push:
    branches: [main]
    paths:
      - 'Projects/CloudSpreadsheet/src/**'
      - '.github/workflows/cloud-spreadsheet-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io

concurrency:
  group: cloud-spreadsheet-image
  cancel-in-progress: true

env:
  IMAGE_NAME: cloudspreadsheet
  VERSIONS_TO_KEEP: 5   # older image versions are deleted after each push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/CloudSpreadsheet/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A failing test stops the workflow before anything is pushed
      - name: Run tests
        run: dotnet test CloudSpreadsheet.slnx -c Release

      - name: Compute image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr.io names must be lowercase
          echo "repository=${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The .NET SDK builds the image on top of mcr.microsoft.com/dotnet/aspnet and pushes it
      # straight to the registry; no Dockerfile or Docker daemon is involved.
      # PublishRepositoryUrl adds the org.opencontainers.image.source label, which links the
      # package to this repository on GitHub.
      - name: Build and push image with the .NET SDK
        env:
          SDK_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          SDK_CONTAINER_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet publish CloudSpreadsheet/CloudSpreadsheet.csproj \
            -c Release -r linux-x64 -t:PublishContainer \
            -p:PublishRepositoryUrl=true \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.meta.outputs.repository }} \
            -p:ContainerImageTags="\"${{ steps.meta.outputs.sha_tag }};latest\""

      # Keep the package small: only the newest versions are kept. Base-image layers are shared
      # between versions, so each extra version only costs the small app layer anyway.
      # Make sure the version Azure Container Apps runs is among those kept, or it can't be
      # pulled when the app scales up from zero.
      - name: Delete old image versions (keep newest ${{ env.VERSIONS_TO_KEEP }})
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: ${{ env.VERSIONS_TO_KEEP }}

      - name: Summary
        run: |
          image="ghcr.io/${{ steps.meta.outputs.repository }}"
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${image}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`${image}:latest\`"
            echo ""
            echo "Deploy a specific build to Azure Container Apps with:"
            echo ""
            echo "\`az containerapp update --name <app> --resource-group <rg> --image ${image}:${{ steps.meta.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
