# Builds the REST API Health Monitor Angular app and deploys it to Azure Static Web Apps.
# Requires the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_REST_API_HEALTH_MONITOR
# (the deployment token from the Static Web App's Overview > "Manage deployment token").
name: Deploy REST API Health Monitor

on:
  push:
    branches: [main]
    paths:
      - 'Projects/rest-api-health-monitor/src/**'
      - '.github/workflows/rest-api-health-monitor-swa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rest-api-health-monitor-deploy
  cancel-in-progress: true

env:
  APP_DIR: Projects/rest-api-health-monitor/src

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/rest-api-health-monitor/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      # We build above with a pinned Node version, so the action only uploads the output
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_REST_API_HEALTH_MONITOR }}
          action: upload
          app_location: ${{ env.APP_DIR }}/dist/rest-api-health-monitor/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
