# Builds the StockTicker NASDAQ server container image with the .NET SDK (no Dockerfile)
# and pushes it to GitHub Container Registry (ghcr.io).
#
# Image: ghcr.io/<owner>/stockticker-nasdaq-server, tagged sha-<short commit> and latest.
# No secrets needed: it signs in to ghcr.io with the workflow's built-in GITHUB_TOKEN.
# The package appears under the repository after the first successful run of this workflow.
name: Build StockTicker NASDAQ server image

on:
  push:
    branches: [main]
    paths:
      - 'Projects/StockTickerMarketDataNASDAQ/src/backend/**'
      - '.github/workflows/stockticker-nasdaq-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to ghcr.io

concurrency:
  group: stockticker-nasdaq-server-image
  cancel-in-progress: true

env:
  IMAGE_NAME: stockticker-nasdaq-server
  PROJECT: Projects/StockTickerMarketDataNASDAQ/src/backend/StockTickerNasdaq.Server/StockTickerNasdaq.Server.csproj

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr.io names must be lowercase
          echo "repository=${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # PublishRepositoryUrl adds the org.opencontainers.image.source label, which links the
      # package to this repository on GitHub.
      - name: Build and push image with the .NET SDK
        env:
          SDK_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          SDK_CONTAINER_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet publish "$PROJECT" \
            -c Release -r linux-x64 -t:PublishContainer \
            -p:PublishRepositoryUrl=true \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ steps.meta.outputs.repository }} \
            -p:ContainerImageTags="\"${{ steps.meta.outputs.sha_tag }};latest\""

      - name: Summary
        run: |
          image="ghcr.io/${{ steps.meta.outputs.repository }}"
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${image}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`${image}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
